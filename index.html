<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>鲁工不要慌工具箱</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <!-- focus styles moved to css/layout.css -->
</head>
<body>
  <div id="auth-gate" class="auth-gate" style="display:none;">
    <div class="auth-panel">
      <div class="auth-logo">🛠️</div>
      <h1 class="auth-title">鲁工不要慌工具箱</h1>
      <p class="auth-sub">请输入访问口令</p>
      <input type="password" id="auth-input" class="auth-input" placeholder="访问口令" autocomplete="current-password" />
      <div id="auth-error" class="auth-error"></div>
      <button class="btn auth-btn" id="auth-submit">进入工具箱</button>
    </div>
  </div>
  <script>
    // 防闪现：无登录 token 时立即显示登录门（严格校验在 app.js 进行）
    (function () {
      try {
        if (!localStorage.getItem('tools_auth_token')) {
          document.getElementById('auth-gate').style.display = 'flex';
          document.body.classList.add('auth-locked');
        }
      } catch (e) {}
    })();
  </script>

  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <div class="brand">🛠️ 鲁工不要慌</div>
      <div class="search-box">
        <input type="text" id="tool-search" placeholder="搜索工具... (/)" />
      </div>
    </div>
    <nav id="nav-list" class="nav-list">
      <!-- 动态生成 -->
    </nav>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="theme-btn" title="切换主题">🌙</button>
      <button class="theme-btn" onclick="location.hash='settings'" title="设置">⚙️</button>
    </div>
  </aside>

  <div class="overlay" id="sidebar-overlay"></div>

  <div id="update-toast" class="update-toast">
    <span>🔄 有新版本可用</span>
    <button onclick="location.reload()">立即刷新</button>
  </div>

  <div class="app-wrapper">
    <header class="top-bar">
      <button id="menu-toggle" class="menu-toggle" aria-label="菜单">☰</button>
      <span class="page-title" id="page-title">鲁工不要慌工具箱</span>
      <button id="theme-toggle-mobile" class="theme-btn" title="切换主题">🌙</button>
    </header>
    <main id="app-main" class="app-main"></main>
  </div>

  <script type="module" src="./js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && !(window.electronAPI && window.electronAPI.isElectron)) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.error('SW registration failed:', err));
    }
  </script>
</body>
</html>
