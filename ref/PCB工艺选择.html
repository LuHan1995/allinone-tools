<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>福立仪器PCB制作工艺生成器 v1.1</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Microsoft YaHei", sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        
        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 5px;
        }
        
        .version {
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .form-section {
            margin-bottom: 25px;
            padding: 15px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #3498db;
            padding-bottom: 8px;
            border-bottom: 1px dashed #e0e0e0;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        
        select, input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        
        .row {
            display: flex;
            flex-wrap: wrap;
            margin: 0 -10px;
        }
        
        .col {
            flex: 1;
            padding: 0 10px;
            min-width: 200px;
        }
        
        .button-group {
            text-align: center;
            margin-top: 30px;
        }
        
        button {
            padding: 10px 25px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin: 0 10px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #2980b9;
        }
        
        button#resetBtn {
            background-color: #e74c3c;
        }
        
        button#resetBtn:hover {
            background-color: #c0392b;
        }
        
        .note {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 5px;
        }
        
        footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 15px;
            border-top: 1px solid #eee;
            color: #7f8c8d;
            font-size: 14px;
        }
        
        .result-area {
            margin-top: 30px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 5px;
            background-color: #f9f9f9;
            display: none;
        }
        
        .result-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #2c3e50;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .result-content {
            line-height: 1.6;
            white-space: pre-line;
            background-color: white;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #ddd;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .copy-btn {
            background-color: #2ecc71;
            padding: 5px 15px;
            font-size: 14px;
        }
        
        .copy-btn:hover {
            background-color: #27ae60;
        }
        
        .success-message {
            color: #2ecc71;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>福立仪器PCB制作工艺生成器</h1>
            <div class="version">版本号: 1.1 | 作者: 鲁涵</div>
        </header>
        
        <form id="pcbForm">
            <!-- PCB基本信息 -->
            <div class="form-section">
                <div class="section-title">PCB基本信息</div>
                
                <div class="form-group">
                    <label>板材类别：</label>
                    <select id="materialType" required>
                        <option value="">请选择</option>
                        <option value="FR-4">FR-4</option>
                        <option value="FR-4(无卤)">FR-4(无卤)</option>
                        <option value="FR-4(CT1600)">FR-4(CT1600)</option>
                        <option value="铝基板">铝基板</option>
                        <option value="铜基板">铜基板</option>
                        <option value="高频/混压">高频/混压</option>
                        <option value="HDI">HDI</option>
                        <option value="FPC">FPC</option>
                        <option value="CEM-1">CEM-1</option>
                        <option value="22F">22F</option>
                        <option value="CEM-3">CEM-3</option>
                    </select>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>板子层数：</label>
                            <select id="layerCount" required>
                                <option value="">请选择</option>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="4">4</option>
                                <option value="6">6</option>
                                <option value="8">8</option>
                                <option value="10">10</option>
                                <option value="12">12</option>
                                <option value="14">14</option>
                                <option value="16">16</option>
                                <option value="18">18</option>
                                <option value="20">20</option>
                                <option value="更多层数">更多层数</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>HDI(盲埋孔)：</label>
                            <select id="hdiType" required>
                                <option value="无">无</option>
                                <option value="1阶">1阶</option>
                                <option value="2阶">2阶</option>
                                <option value="3阶">3阶</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>板子长度 (CM)：</label>
                            <input type="number" id="boardLength" min="0" step="0.1" required>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>板子宽度 (CM)：</label>
                            <input type="number" id="boardWidth" min="0" step="0.1" required>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>板子数量 (pcs)：</label>
                            <input type="number" id="boardQuantity" min="1" required>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>出货方式：</label>
                            <select id="deliveryMethod" required>
                                <option value="单片出货">单片出货</option>
                                <option value="客户拼版">客户拼版</option>
                                <option value="捷配代拼">捷配代拼</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>拼版款数：</label>
                            <input type="number" id="panelCount" min="1" value="1">
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>订单阶段：</label>
                            <select id="orderStage" required>
                                <option value="研发打样">研发打样</option>
                                <option value="量产试样">量产试样</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- PCB工艺信息 -->
            <div class="form-section">
                <div class="section-title">PCB工艺信息</div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>板子厚度 (mm)：</label>
                            <select id="boardThickness" required>
                                <option value="">请选择</option>
                                <option value="0.4">0.4</option>
                                <option value="0.6">0.6</option>
                                <option value="0.8">0.8</option>
                                <option value="1.0">1.0</option>
                                <option value="1.2">1.2</option>
                                <option value="1.6">1.6</option>
                                <option value="2.0">2.0</option>
                                <option value="2.4">2.4</option>
                                <option value="2.5">2.5</option>
                                <option value="3.0">3.0</option>
                                <option value="3.6">3.6</option>
                                <option value="4.0">4.0</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>铜箔厚度(外层)：</label>
                            <select id="copperThickness" required>
                                <option value="">请选择</option>
                                <option value="1oz">1oz</option>
                                <option value="2oz">2oz</option>
                                <option value="3oz">3oz</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>阻焊颜色：</label>
                            <select id="solderMaskColor" required>
                                <option value="绿色">绿色</option>
                                <option value="冷白色">冷白色</option>
                                <option value="蓝色">蓝色</option>
                                <option value="黑色">黑色</option>
                                <option value="黄色">黄色</option>
                                <option value="红色">红色</option>
                                <option value="哑光黑">哑光黑</option>
                                <option value="哑光绿">哑光绿</option>
                                <option value="紫色">紫色</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>字符颜色：</label>
                            <select id="legendColor" required>
                                <option value="白色">白色</option>
                                <option value="黑色">黑色</option>
                                <option value="黄色">黄色</option>
                                <option value="无">无</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>最小线宽/线距：</label>
                            <select id="minLineWidth" required>
                                <option value="3/3mil">3/3mil</option>
                                <option value="3.5/3.5mil">3.5/3.5mil</option>
                                <option value="4/4mil">4/4mil</option>
                                <option value="5/5mil">5/5mil</option>
                                <option value="6/6mil↑">6/6mil↑</option>
                                <option value="8/8mil↑">8/8mil↑</option>
                                <option value="10/10mil↓">10/10mil↓</option>
                                <option value="20/20mil↑">20/20mil↑</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>最小孔径 (mm)：</label>
                            <select id="minHoleSize" required>
                                <option value="0.15">0.15</option>
                                <option value="0.2">0.2</option>
                                <option value="0.25">0.25</option>
                                <option value="0.3">0.3</option>
                                <option value="0.35">0.35</option>
                                <option value="0.4">0.4</option>
                                <option value="0.5">0.5</option>
                                <option value="0.6">0.6</option>
                                <option value="0.7">0.7</option>
                                <option value="0.8↑">0.8↑</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>阻焊覆盖：</label>
                            <select id="solderMaskCoverage" required>
                                <option value="过孔盖油">过孔盖油</option>
                                <option value="过孔塞油">过孔塞油</option>
                                <option value="过孔开窗">过孔开窗</option>
                                <option value="过孔塞树脂+过孔电镀盖帽">过孔塞树脂+过孔电镀盖帽</option>
                            </select>
                            <div class="note">*过孔>塞孔极限，会默认按盖油处理，如不接受，需备注接受缩孔塞油，gerber文件格式一律按文件加工，此选项无效！</div>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>测试方式：</label>
                            <select id="testingMethod" required>
                                <option value="100%飞针测试">100%飞针测试</option>
                                <option value="工程测试架">工程测试架</option>
                            </select>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>焊盘表面处理：</label>
                            <select id="surfaceFinish" required>
                                <option value="裸铜">裸铜</option>
                                <option value="有铅喷锡">有铅喷锡</option>
                                <option value="无铅喷锡">无铅喷锡</option>
                                <option value="沉金">沉金</option>
                                <option value="OSP">OSP</option>
                                <option value="沉锡">沉锡</option>
                                <option value="沉银">沉银</option>
                                <option value="电镀金">电镀金</option>
                                <option value="化学镀锌金">化学镀锌金</option>
                                <option value="沉金+选择性OSP">沉金+选择性OSP</option>
                                <option value="无铅喷锡+选择性沉金">无铅喷锡+选择性沉金</option>
                                <option value="无铅喷锡+选择性电镀金">无铅喷锡+选择性电镀金</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>阻抗：</label>
                            <select id="impedance" required>
                                <option value="否">否</option>
                                <option value="是">是</option>
                            </select>
                            <div class="note">*请用文档标明需制作阻抗线的位置及阻值大小，并和PCB文件一起压缩上传</div>
                        </div>
                    </div>
                </div>
                
                <div class="row">
                    <div class="col">
                        <div class="form-group">
                            <label>成型方式：</label>
                            <select id="formingMethod" required>
                                <option value="机械成型">机械成型</option>
                                <option value="模具成型">模具成型</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>半孔：</label>
                            <select id="halfHole" required>
                                <option value="无">无</option>
                                <option value="一边">一边</option>
                                <option value="两边">两边</option>
                                <option value="三边">三边</option>
                                <option value="四边">四边</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="col">
                        <div class="form-group">
                            <label>孔铜：</label>
                            <select id="holeCopper" required>
                                <option value="18um">18um</option>
                                <option value="20um">20um</option>
                                <option value="25um">25um</option>
                                <option value="30um">30um</option>
                                <option value="35um">35um</option>
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="button-group">
                <button type="button" id="generateBtn">生成工艺规范</button>
                <button type="button" id="resetBtn">重置表单</button>
            </div>
            
            <div id="resultArea" class="result-area">
                <div class="result-title">
                    <span>PCB制作工艺规范</span>
                    <button type="button" id="copyBtn" class="copy-btn">复制内容</button>
                </div>
                <div id="resultContent" class="result-content"></div>
                <div id="successMessage" class="success-message">内容已复制到剪贴板！</div>
            </div>
        </form>
        
        <footer>
            <p>福立仪器PCB制作工艺生成器 v1.1 | 内部使用工具</p>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('pcbForm');
            const generateBtn = document.getElementById('generateBtn');
            const resetBtn = document.getElementById('resetBtn');
            const copyBtn = document.getElementById('copyBtn');
            const resultArea = document.getElementById('resultArea');
            const resultContent = document.getElementById('resultContent');
            const successMessage = document.getElementById('successMessage');
            
            // 生成工艺规范
            generateBtn.addEventListener('click', function() {
                if (!form.checkValidity()) {
                    alert('请填写所有必填字段！');
                    return;
                }
                
                // 收集表单数据
                const formData = getFormData();
                
                // 生成工艺规范文本
                const specificationText = generateSpecification(formData);
                
                // 显示结果
                resultContent.textContent = specificationText;
                resultArea.style.display = 'block';
                
                // 滚动到结果区域
                resultArea.scrollIntoView({ behavior: 'smooth' });
            });
            
            // 复制内容
            copyBtn.addEventListener('click', function() {
                const textToCopy = resultContent.textContent;
                
                // 使用现代剪贴板API
                navigator.clipboard.writeText(textToCopy).then(function() {
                    // 显示成功消息
                    successMessage.style.display = 'block';
                    
                    // 3秒后隐藏成功消息
                    setTimeout(function() {
                        successMessage.style.display = 'none';
                    }, 3000);
                }).catch(function(err) {
                    // 备用方法
                    const textArea = document.createElement('textarea');
                    textArea.value = textToCopy;
                    document.body.appendChild(textArea);
                    textArea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textArea);
                    
                    // 显示成功消息
                    successMessage.style.display = 'block';
                    
                    // 3秒后隐藏成功消息
                    setTimeout(function() {
                        successMessage.style.display = 'none';
                    }, 3000);
                });
            });
            
            // 重置表单
            resetBtn.addEventListener('click', function() {
                if (confirm('确定要重置所有表单数据吗？')) {
                    form.reset();
                    resultArea.style.display = 'none';
                }
            });
            
            // 获取表单数据的辅助函数
            function getFormData() {
                return {
                    materialType: document.getElementById('materialType').value,
                    layerCount: document.getElementById('layerCount').value,
                    hdiType: document.getElementById('hdiType').value,
                    boardLength: document.getElementById('boardLength').value,
                    boardWidth: document.getElementById('boardWidth').value,
                    boardQuantity: document.getElementById('boardQuantity').value,
                    deliveryMethod: document.getElementById('deliveryMethod').value,
                    panelCount: document.getElementById('panelCount').value,
                    orderStage: document.getElementById('orderStage').value,
                    boardThickness: document.getElementById('boardThickness').value,
                    copperThickness: document.getElementById('copperThickness').value,
                    solderMaskColor: document.getElementById('solderMaskColor').value,
                    legendColor: document.getElementById('legendColor').value,
                    minLineWidth: document.getElementById('minLineWidth').value,
                    minHoleSize: document.getElementById('minHoleSize').value,
                    solderMaskCoverage: document.getElementById('solderMaskCoverage').value,
                    testingMethod: document.getElementById('testingMethod').value,
                    surfaceFinish: document.getElementById('surfaceFinish').value,
                    impedance: document.getElementById('impedance').value,
                    formingMethod: document.getElementById('formingMethod').value,
                    halfHole: document.getElementById('halfHole').value,
                    holeCopper: document.getElementById('holeCopper').value
                };
            }
            
            // 生成工艺规范的辅助函数
            function generateSpecification(formData) {
                return `福立仪器PCB制作工艺规范
 生成日期: ${new Date().toLocaleDateString()}

==================== PCB基本信息 ====================

板材类别: ${formData.materialType}
板子层数: ${formData.layerCount}
HDI(盲埋孔): ${formData.hdiType}
板子尺寸: ${formData.boardLength}cm × ${formData.boardWidth}cm
板子数量: ${formData.boardQuantity}pcs
出货方式: ${formData.deliveryMethod}
拼版款数: ${formData.panelCount}
订单阶段: ${formData.orderStage}

==================== PCB工艺信息 ====================

板子厚度: ${formData.boardThickness}mm
铜箔厚度(外层): ${formData.copperThickness}
阻焊颜色: ${formData.solderMaskColor}
字符颜色: ${formData.legendColor}
最小线宽/线距: ${formData.minLineWidth}
最小孔径: ${formData.minHoleSize}mm
阻焊覆盖: ${formData.solderMaskCoverage}
测试方式: ${formData.testingMethod}
焊盘表面处理: ${formData.surfaceFinish}
阻抗: ${formData.impedance}
成型方式: ${formData.formingMethod}
半孔: ${formData.halfHole}
孔铜: ${formData.holeCopper}

====================================================

备注:
1. 过孔>塞孔极限，会默认按盖油处理，如不接受，需备注接受缩孔塞油
2. gerber文件格式一律按文件加工，阻焊覆盖选项无效
3. 如选择阻抗为"是"，请用文档标明需制作阻抗线的位置及阻值大小，并和PCB文件一起压缩上传

福立仪器PCB制作工艺生成器 v1.1 | 作者: 鲁涵
生成时间: ${new Date().toLocaleString()}`;
            }
        });
    </script>
</body>
</html>
