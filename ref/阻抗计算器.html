<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>PCB 阻抗计算器</title>
    <style>
        .imp-card { background: #fff; padding: 25px; border-radius: 12px; max-width: 500px; margin: 20px auto; border: 1px solid #e2e8f0; font-family: sans-serif; }
        .tab-group { display: flex; margin-bottom: 20px; border-bottom: 2px solid #eee; }
        .tab { padding: 10px 20px; cursor: pointer; border: none; background: none; font-weight: bold; color: #64748b; }
        .tab.active { color: #2563eb; border-bottom: 2px solid #2563eb; margin-bottom: -2px; }
        .input-item { margin-bottom: 15px; }
        label { display: block; font-size: 13px; color: #475569; margin-bottom: 5px; }
        input { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 4px; box-sizing: border-box; }
        .res-display { background: #f8fafc; padding: 15px; border-radius: 8px; text-align: center; margin-top: 20px; }
        .res-val { font-size: 24px; font-weight: bold; color: #2563eb; }
    </style>
</head>
<body>

<div class="imp-card">
    <h2 style="margin-top:0">🎛️ 阻抗计算 (Impedance)</h2>
    
    <div class="tab-group">
        <button class="tab active" onclick="setMode('micro')">表面微带线</button>
        <button class="tab" onclick="setMode('strip')">内层带状线</button>
    </div>

    <div class="input-item">
        <label>走线宽度 (W) - mil</label>
        <input type="number" id="w" value="10" oninput="calcImp()">
    </div>
    
    <div class="input-item">
        <label id="h-label">介质厚度 (H) - mil</label>
        <input type="number" id="h" value="6" oninput="calcImp()">
    </div>

    <div class="input-item">
        <label>铜厚 (T) - mil (1oz=1.37)</label>
        <input type="number" id="t" value="1.37" oninput="calcImp()">
    </div>

    <div class="input-item">
        <label>介电常数 (Er) - FR-4通常为4.2</label>
        <input type="number" id="er" value="4.2" step="0.1" oninput="calcImp()">
    </div>

    <div class="res-display">
        <div style="font-size: 14px; color: #64748b;">特征阻抗 (Z₀)</div>
        <div class="res-val"><span id="z0">0.0</span> Ω</div>
    </div>
</div>

<script>
let mode = 'micro';

function setMode(m) {
    mode = m;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    event.target.classList.add('active');
    document.getElementById('h-label').innerText = m === 'micro' ? '介质厚度 (H) - mil' : '平面间总距 (B) - mil';
    calcImp();
}

function calcImp() {
    const w = parseFloat(document.getElementById('w').value);
    const h = parseFloat(document.getElementById('h').value);
    const t = parseFloat(document.getElementById('t').value);
    const er = parseFloat(document.getElementById('er').value);

    if (!w || !h || !t || !er) return;

    let z0 = 0;
    if (mode === 'micro') {
        // 微带线 IPC-2141 公式
        const term1 = 87 / Math.sqrt(er + 1.41);
        const term2 = Math.log((5.98 * h) / (0.8 * w + t));
        z0 = term1 * term2;
    } else {
        // 带状线 IPC-2141 公式
        const term1 = 60 / Math.sqrt(er);
        const term2 = Math.log((1.9 * h) / (0.8 * w + t));
        z0 = term1 * term2;
    }

    document.getElementById('z0').innerText = z0.toFixed(1);
}

window.onload = calcImp;
</script>

</body>
</html>
