<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCB 载流能力综合工具</title>
    <style>
        :root { --primary: #2563eb; --bg: #f8fafc; --card: #ffffff; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); color: #1e293b; line-height: 1.6; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 30px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; }
        .card { background: var(--card); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid #e2e8f0; }
        h2 { margin-top: 0; font-size: 1.25rem; display: flex; align-items: center; gap: 10px; color: var(--primary); }
        .input-group { margin-bottom: 16px; }
        label { display: block; font-size: 0.875rem; font-weight: 600; margin-bottom: 6px; color: #64748b; }
        .flex-box { display: flex; gap: 8px; }
        input, select { flex: 1; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; }
        input:focus { outline: 2px solid #93c5fd; border-color: var(--primary); }
        .res-container { margin-top: 20px; padding: 15px; background: #eff6ff; border-radius: 8px; text-align: center; }
        .res-label { font-size: 0.875rem; color: #3b82f6; font-weight: bold; text-transform: uppercase; }
        .res-value { font-size: 2rem; font-weight: 800; color: #1d4ed8; }
        .footer-tools { margin-top: 30px; text-align: center; }
        button { background: var(--primary); color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: 600; transition: opacity 0.2s; }
        button:hover { opacity: 0.9; }
        @media print { .footer-tools, select, input { display: none; } .card { box-shadow: none; border: 1px solid #000; } }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PCB 硬件设计助手</h1>
        <p>基于 IPC-2221 标准 | 2026 工程师版</p>
    </header>

    <div class="grid">
        <div class="card">
            <h2>📏 走线载流 (Trace)</h2>
            <div class="input-group">
                <label>走线宽度</label>
                <div class="flex-box">
                    <input type="number" id="t_width" value="20" oninput="calcAll()">
                    <select id="t_widthUnit" onchange="calcAll()" style="flex:0.4">
                        <option value="mil">mil</option>
                        <option value="mm">mm</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>铜箔厚度 (oz)</label>
                <input type="number" id="t_thick" value="1" step="0.5" oninput="calcAll()">
            </div>
            <div class="input-group">
                <label>允许温升 (°C)</label>
                <input type="number" id="t_temp" value="10" oninput="calcAll()">
            </div>
            <div class="input-group">
                <label>层位置</label>
                <select id="t_layer" onchange="calcAll()">
                    <option value="ext">外层 (External)</option>
                    <option value="int">内层 (Internal)</option>
                </select>
            </div>
            <div class="res-container">
                <div class="res-label">最大电流 (Trace)</div>
                <div class="res-value"><span id="res_trace">0.00</span> A</div>
            </div>
        </div>

        <div class="card">
            <h2>🕳️ 过孔载流 (Via)</h2>
            <div class="input-group">
                <label>过孔孔径</label>
                <div class="flex-box">
                    <input type="number" id="v_diam" value="0.3" step="0.1" oninput="calcAll()">
                    <select id="v_diamUnit" onchange="calcAll()" style="flex:0.4">
                        <option value="mm">mm</option>
                        <option value="mil">mil</option>
                    </select>
                </div>
            </div>
            <div class="input-group">
                <label>孔壁电镀厚度 (mil)</label>
                <input type="number" id="v_plate" value="0.8" step="0.1" oninput="calcAll()">
            </div>
            <div class="input-group">
                <label>允许温升 (°C)</label>
                <input type="number" id="v_temp" value="10" oninput="calcAll()">
            </div>
            <div class="res-container" style="background: #f0fdf4; border-color: #dcfce7;">
                <div class="res-label" style="color: #16a34a;">最大电流 (Via)</div>
                <div class="res-value" style="color: #15803d;"><span id="res_via">0.00</span> A</div>
            </div>
        </div>
    </div>

    <div class="footer-tools">
        <button onclick="window.print()">🖨️ 打印/保存设计报告</button>
        <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 15px;">
            注意：计算结果仅供参考。高压或大电流设计请务必留出 20%-30% 的降额空间。
        </p>
    </div>
</div>

<script>
function calcAll() {
    // 1. 走线逻辑
    let tW = parseFloat(document.getElementById('t_width').value);
    if(document.getElementById('t_widthUnit').value === 'mm') tW /= 0.0254;
    const tT = parseFloat(document.getElementById('t_thick').value) * 1.37;
    const tRise = parseFloat(document.getElementById('t_temp').value);
    const tK = document.getElementById('t_layer').value === 'ext' ? 0.048 : 0.024;
    
    const tArea = tW * tT;
    const tCurr = tK * Math.pow(tRise, 0.44) * Math.pow(tArea, 0.725);
    document.getElementById('res_trace').innerText = tCurr.toFixed(2);

    // 2. 过孔逻辑
    let vD = parseFloat(document.getElementById('v_diam').value);
    if(document.getElementById('v_diamUnit').value === 'mm') vD /= 0.0254;
    const vP = parseFloat(document.getElementById('v_plate').value);
    const vRise = parseFloat(document.getElementById('v_temp').value);
    
    // 过孔面积近似 π * d * t
    const vArea = Math.PI * vD * vP;
    const vCurr = 0.024 * Math.pow(vRise, 0.44) * Math.pow(vArea, 0.725);
    document.getElementById('res_via').innerText = vCurr.toFixed(2);
}

window.onload = calcAll;
</script>

</body>
</html>
