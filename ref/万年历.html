<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>万年历（含农历 & 本地日程）</title>
  <style>
    :root{--bg:#f6f7fb;--card:#fff;--accent:#3b82f6;--muted:#666}
    *{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial}
    body{margin:0;background:var(--bg);color:#111;padding:18px}
    .wrap{max-width:980px;margin:12px auto}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
    h1{font-size:20px;margin:0}
    .controls{display:flex;gap:8px;align-items:center}
    .controls input[type=number]{width:90px;padding:6px;border-radius:6px;border:1px solid #ddd}
    .btn{background:var(--accent);color:#fff;padding:8px 10px;border-radius:8px;border:0;cursor:pointer}
    .calendar{background:var(--card);padding:12px;border-radius:12px;box-shadow:0 6px 20px rgba(50,50,93,0.06)}
    .month-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
    .month-head .nav{display:flex;gap:6px}
    .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
    .weekday{background:#fafafa;padding:8px;text-align:center;font-weight:600;border-radius:6px}
    .cell{min-height:84px;background:#fff;padding:8px;border-radius:8px;border:1px solid #f0f0f0;position:relative}
    .cell.out{opacity:.35}
    .date-num{font-weight:700}
    .lunar{font-size:12px;color:var(--muted);margin-top:4px}
    .dots{position:absolute;left:8px;bottom:6px;display:flex;gap:4px}
    .dot{width:8px;height:8px;border-radius:50%;background:#ddd}
    .dot.has{background:var(--accent)}
    .today{box-shadow:0 0 0 2px rgba(59,130,246,.12) inset}
    .events-list{margin-top:8px;font-size:12px;color:var(--muted);max-height:36px;overflow:hidden}
    .modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
    .panel{background:#fff;padding:16px;border-radius:10px;min-width:320px;max-width:720px}
    .flex{display:flex;gap:8px}
    input,textarea,select{width:100%;padding:8px;border-radius:6px;border:1px solid #ddd}
    label{font-size:13px;color:#333}
    .event{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px dashed #eee}
    .small{font-size:13px;color:var(--muted)}
    footer{margin-top:12px;color:var(--muted);font-size:13px}
    @media (max-width:640px){.cell{min-height:72px}.panel{width:92%}}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>万年历 — 公历 + 农历 + 本地日程</h1>
      <div class="controls">
        <div class="nav">
          <button class="btn" id="prevYear">« 年</button>
          <button class="btn" id="prevMonth">‹ 月</button>
        </div>
        <div style="display:flex;flex-direction:column">
          <div id="ymTitle" style="font-weight:700;text-align:center"></div>
          <div style="font-size:12px;color:var(--muted);text-align:center" id="todayLabel"></div>
        </div>
        <div class="nav">
          <button class="btn" id="nextMonth">月 ›</button>
          <button class="btn" id="nextYear">年 »</button>
        </div>
        <input type="number" id="jumpYear" placeholder="年 (YYYY)" />
        <input type="number" id="jumpMonth" placeholder="月 (1-12)" min="1" max="12" />
        <button class="btn" id="doJump">跳转</button>
      </div>
    </header>

    <div class="calendar">
      <div class="month-head">
        <div class="small">点击某一天以增删/查看本地日程（保存到浏览器 localStorage）</div>
        <div class="small">支持按年/按月跳转</div>
      </div>
      <div class="grid" id="weekdayRow">
        <!-- weekdays -->
      </div>
      <div class="grid" id="dateGrid">
        <!-- date cells -->
      </div>
    </div>

    <footer>本地日程保存在浏览器，清除浏览器数据会丢失。可导出/导入 JSON。</footer>
  </div>

  <!-- modal -->
  <div id="modal" style="display:none" class="modal">
    <div class="panel">
      <h3 id="modalTitle">日程 — <span id="modalDate"></span></h3>
      <div style="display:flex;gap:12px;margin:8px 0">
        <div style="flex:1">
          <label>时间</label>
          <input id="evtTime" type="time" />
        </div>
        <div style="flex:2">
          <label>标题</label>
          <input id="evtTitle" placeholder="例：会议 / 生日" />
        </div>
      </div>
      <div>
        <label>说明</label>
        <textarea id="evtNote" rows="3"></textarea>
      </div>
      <div style="display:flex;gap:8px;margin-top:10px;justify-content:flex-end">
        <button id="exportBtn" class="btn" style="background:#10b981">导出</button>
        <button id="importBtn" class="btn" style="background:#f59e0b">导入</button>
        <button id="addEvt" class="btn">新增</button>
        <button id="closeModal" class="btn" style="background:#ef4444">关闭</button>
      </div>
      <div id="eventsContainer" style="margin-top:12px"></div>
    </div>
  </div>

  <script>
  // ---------- 日历数据与状态 ----------
  const today = new Date();
  let curYear = today.getFullYear();
  let curMonth = today.getMonth(); // 0-based

  const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
  const weekdayRow = document.getElementById('weekdayRow');
  const dateGrid = document.getElementById('dateGrid');
  const ymTitle = document.getElementById('ymTitle');
  const todayLabel = document.getElementById('todayLabel');
  const modal = document.getElementById('modal');
  const modalDate = document.getElementById('modalDate');
  const eventsContainer = document.getElementById('eventsContainer');
  const evtTime = document.getElementById('evtTime');
  const evtTitle = document.getElementById('evtTitle');
  const evtNote = document.getElementById('evtNote');
  const addEvtBtn = document.getElementById('addEvt');
  const exportBtn = document.getElementById('exportBtn');
  const importBtn = document.getElementById('importBtn');
  const jumpYear = document.getElementById('jumpYear');
  const jumpMonth = document.getElementById('jumpMonth');
  const doJump = document.getElementById('doJump');

  // render weekday header
  weekdays.forEach(w=>{const d=document.createElement('div');d.className='weekday';d.textContent=w;weekdayRow.appendChild(d)})

  // localStorage key
  const STORAGE_KEY = 'my_perpetual_calendar_events_v1';
  function loadEvents(){
    try{return JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}')}
    catch(e){return{}}
  }
  function saveEvents(obj){localStorage.setItem(STORAGE_KEY, JSON.stringify(obj))}

  // ---------- 农历计算（1900 - 2050）
  // 数据来源：常见万年历算法表（为了减小篇幅仅到2050）
  const lunarInfo = [
    0x04bd8,0x04ae0,0x0a570,0x054d5,0x0d260,0x0d950,0x16554,0x056a0,0x09ad0,0x055d2,
    0x04ae0,0x0a5b6,0x0a4d0,0x0d250,0x1d255,0x0b540,0x0d6a0,0x0ada2,0x095b0,0x14977,
    0x04970,0x0a4b0,0x0b4b5,0x06a50,0x06d40,0x1ab54,0x02b60,0x09570,0x052f2,0x04970,
    0x06566,0x0d4a0,0x0ea50,0x06e95,0x05ad0,0x02b60,0x186e3,0x092e0,0x1c8d7,0x0c950,
    0x0d4a0,0x1d8a6,0x0b550,0x056a0,0x1a5b4,0x025d0,0x092d0,0x0d2b2,0x0a950,0x0b557,
    0x06ca0,0x0b550,0x15355,0x04da0,0x0a5d0,0x14573,0x052d0,0x0a9a8,0x0e950,0x06aa0,
    0x0aea6,0x0ab50,0x04b60,0x0aae4,0x0a570,0x05260,0x0f263,0x0d950,0x05b57,0x056a0,
    0x096d0,0x04dd5,0x04ad0,0x0a4d0,0x0d4d4,0x0d250,0x0d558,0x0b540,0x0b5a0,0x195a6,
    0x095b0,0x049b0,0x0a974,0x0a4b0,0x0b27a,0x06a50,0x06d40,0x0af46,0x0ab60,0x09570,
    0x04af5,0x04970,0x064b0,0x074a3,0x0ea50,0x06b58,0x055c0,0x0ab60,0x096d5,0x092e0,
    0x0c960,0x0d954,0x0d4a0,0x0da50,0x07552,0x056a0,0x0abb7,0x025d0,0x092d0,0x0cab5,
    0x0a950,0x0b4a0,0x0baa4,0x0ad50,0x055d9,0x04ba0,0x0a5b0,0x15176,0x052b0,0x0a930,
    0x07954,0x06aa0,0x0ad50,0x05b52,0x04b60,0x0a6e6,0x0a4e0,0x0d260,0x0ea65,0x0d530,
    0x05aa0,0x076a3,0x096d0,0x04bd7,0x04ad0,0x0a4d0,0x1d0b6,0x0d250,0x0d520,0x0dd45,
    0x0b5a0,0x056d0,0x055b2,0x049b0,0x0a577,0x0a4b0,0x0aa50,0x1b255,0x06d20,0x0ada0
  ];

  function lYearDays(y){
    let i,sum=348;
    for(i=0;i<12;i++) if((lunarInfo[y-1900]>>i)&0x1) sum+=1;
    return sum + leapDays(y);
  }
  function leapMonth(y){return lunarInfo[y-1900]&0xf}
  function leapDays(y){ if(leapMonth(y)) return ((lunarInfo[y-1900]&0x10000)?30:29); return 0}
  function monthDays(y,m){ return ((lunarInfo[y-1900]>>(12-m))&0x1)?30:29 }

  // 将公历 date 转为农历 {lYear,lMonth,lDay,leap}
  function solarToLunar(y,m,d){
    // 基准：1900-01-31 对应农历 1900-01-01
    const baseDate = new Date(1900,0,31);
    const objDate = new Date(y,m-1,d);

    let offset = Math.floor((objDate - baseDate)/86400000);
    let i=1900, temp=0;
    for(i=1900;i<2051 && offset>0;i++){
      temp = lYearDays(i);
      if(offset - temp < 0) break;
      offset -= temp;
    }
    let year = i;
    let leap = leapMonth(year);
    let isLeap = false;
    let month =1;
    for(i=1;i<13 && offset>0;i++){
      if(leap>0 && i==(leap+1) && !isLeap){
        --i; isLeap=true; temp=leapDays(year);
      }else{
        temp = monthDays(year,i);
      }
      if(isLeap && i==(leap+1)) isLeap=false;
      if(offset - temp < 0) break;
      offset -= temp;
    }
    month = i; let day = offset+1;
    return {lYear:year,lMonth:month,lDay:day,leap:isLeap}
  }

  // 农历日名称
  const lunarMonthNames = ['正','二','三','四','五','六','七','八','九','十','十一','腊'];
  function lunarDayName(d){
    const chineseTens = ['初','十','廿','卅'];
    const nums = ['一','二','三','四','五','六','七','八','九','十'];
    if(d===10) return '初十';
    let ten = Math.floor((d-1)/10);
    let one = d%10;
    return chineseTens[ten] + (one===0? '十' : nums[one-1]);
  }

  // ---------- 渲染日历 ----------
  function render(){
    dateGrid.innerHTML='';
    ymTitle.textContent = `${curYear} 年 ${curMonth+1} 月`;
    todayLabel.textContent = `今天：${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
    const firstDay = new Date(curYear,curMonth,1);
    const startWeek = firstDay.getDay();
    const daysInMonth = new Date(curYear,curMonth+1,0).getDate();
    const prevDays = new Date(curYear,curMonth,0).getDate();

    // fill cells: some prev month
    const events = loadEvents();
    for(let i=0;i<startWeek;i++){
      const cell = docCell();
      cell.classList.add('out');
      const dateNum = prevDays - startWeek + 1 + i;
      cell.querySelector('.date-num').textContent = dateNum;
      const gY = curMonth===0?curYear-1:curYear;
      const gM = curMonth===0?12:curMonth;
      const lunar = solarToLunar(gY,gM,dateNum);
      cell.querySelector('.lunar').textContent = `${lunar.leap? '闰':''}${lunarMonthNames[lunar.lMonth-1]}月 ${lunarDayName(lunar.lDay)}`;
      dateGrid.appendChild(cell);
    }

    for(let d=1;d<=daysInMonth;d++){
      const cell = docCell();
      const numEl = cell.querySelector('.date-num');
      numEl.textContent = d;
      const lunar = solarToLunar(curYear,curMonth+1,d);
      cell.querySelector('.lunar').textContent = `${lunar.leap? '闰':''}${lunarMonthNames[lunar.lMonth-1]}月 ${lunarDayName(lunar.lDay)}`;

      const iso = `${curYear}-${pad(curMonth+1)}-${pad(d)}`;
      const dayEvents = events[iso]||[];
      // dot indicator
      const dotEl = cell.querySelector('.dot');
      if(dayEvents.length) dotEl.classList.add('has'); else dotEl.classList.remove('has');

      // short list
      const listEl = cell.querySelector('.events-list');
      listEl.innerHTML = dayEvents.slice(0,2).map(e=>`<div>${e.time?e.time+' ':''}${escapeHtml(e.title||'')}</div>`).join('');

      // today highlight
      if(curYear===today.getFullYear() && curMonth===today.getMonth() && d===today.getDate()) cell.classList.add('today')

      // click open modal
      cell.addEventListener('click',()=>openModal(iso));

      dateGrid.appendChild(cell);
    }

    // fill next month's head cells to align 7x
    const totalCells = startWeek + daysInMonth;
    const nextFill = (7 - (totalCells %7))%7;
    for(let i=1;i<=nextFill;i++){
      const cell = docCell(); cell.classList.add('out');
      cell.querySelector('.date-num').textContent = i;
      const gY = curMonth===11?curYear+1:curYear;
      const gM = curMonth===11?1:curMonth+2;
      const lunar = solarToLunar(gY,gM,i);
      cell.querySelector('.lunar').textContent = `${lunar.leap? '闰':''}${lunarMonthNames[lunar.lMonth-1]}月 ${lunarDayName(lunar.lDay)}`;
      dateGrid.appendChild(cell);
    }
  }

  function docCell(){
    const div = document.createElement('div'); div.className='cell';
    div.innerHTML = `<div class="date-num"></div><div class="lunar"></div><div class="events-list"></div><div class="dots"><div class="dot"></div></div>`;
    return div;
  }

  // ---------- modal & events ----------
  let curIso = null;
  function openModal(iso){
    curIso = iso; modal.style.display='flex'; modalDate.textContent = iso;
    evtTime.value=''; evtTitle.value=''; evtNote.value='';
    renderEventsList();
  }
  function closeModal(){ modal.style.display='none'; curIso=null }

  function renderEventsList(){
    const events = loadEvents();
    const list = events[curIso]||[];
    eventsContainer.innerHTML = list.length? list.map((e,idx)=>`<div class="event"><div><div style="font-weight:700">${escapeHtml(e.title||'无标题')}</div><div class="small">${e.time||''} ${escapeHtml(e.note||'')}</div></div><div><button data-i="${idx}" class="btn" style="background:#ef4444">删除</button></div></div>`).join(''): '<div class="small">还没有事件</div>';
    // attach delete
    eventsContainer.querySelectorAll('button[data-i]').forEach(b=>b.addEventListener('click',e=>{
      const idx = +e.currentTarget.dataset.i; removeEvent(idx);
    }))
  }

  function addEvent(){
    if(!curIso) return;
    const title = evtTitle.value.trim();
    if(!title){alert('请填写标题');return}
    const time = evtTime.value; const note = evtNote.value.trim();
    const events = loadEvents(); events[curIso] = events[curIso]||[];
    events[curIso].push({time,title,note,created:Date.now()});
    // sort by time if provided
    events[curIso].sort((a,b)=> (a.time||'99:99') > (b.time||'99:99')?1:-1);
    saveEvents(events); renderEventsList(); render();
    evtTitle.value=''; evtNote.value=''; evtTime.value='';
  }
  function removeEvent(idx){ const events = loadEvents(); if(!events[curIso]) return; events[curIso].splice(idx,1); if(events[curIso].length===0) delete events[curIso]; saveEvents(events); renderEventsList(); render(); }

  // export/import
  exportBtn.addEventListener('click',()=>{
    const data = localStorage.getItem(STORAGE_KEY) || '{}';
    const blob = new Blob([data],{type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href=url; a.download=`calendar_events_${new Date().toISOString().slice(0,10)}.json`; a.click(); URL.revokeObjectURL(url);
  })
  importBtn.addEventListener('click',()=>{
    const input = document.createElement('input'); input.type='file'; input.accept='application/json';
    input.onchange = e=>{
      const f = e.target.files[0]; if(!f) return; const r = new FileReader(); r.onload = ()=>{
        try{const obj = JSON.parse(r.result); saveEvents(obj); alert('导入成功'); render(); closeModal();}catch(err){alert('导入失败：文件格式不对')}
      }; r.readAsText(f);
    }; input.click();
  })

  addEvtBtn.addEventListener('click',addEvent);
  document.getElementById('closeModal').addEventListener('click',closeModal);

  function pad(n){return n<10? '0'+n:''+n}
  function escapeHtml(s){ return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"})[c]) }

  // navigation
  document.getElementById('prevMonth').addEventListener('click',()=>{ curMonth--; if(curMonth<0){curMonth=11;curYear--} render() });
  document.getElementById('nextMonth').addEventListener('click',()=>{ curMonth++; if(curMonth>11){curMonth=0;curYear++} render() });
  document.getElementById('prevYear').addEventListener('click',()=>{ curYear--; render() });
  document.getElementById('nextYear').addEventListener('click',()=>{ curYear++; render() });

  doJump.addEventListener('click',()=>{
    const y = parseInt(jumpYear.value,10); const m = parseInt(jumpMonth.value,10);
    if(!isNaN(y)) curYear = y; if(!isNaN(m) && m>=1 && m<=12) curMonth = m-1; render();
  })

  // initial render
  render();

  // close modal on background click
  modal.addEventListener('click',(e)=>{ if(e.target===modal) closeModal() });

  </script>
</body>
</html>
